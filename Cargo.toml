[workspace]
resolver = "2"
members = [
    "crates/autodoc-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daniel Gonçalves Araujo"]
license = "MIT"
repository = "https://github.com/dandgabr/autodoc"

[workspace.dependencies]
# NAPI-RS Native Bindings
napi = { version = "2.16.16", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2.16.13"
napi-build = "2.2.4"

# Memory Allocator
mimalloc = { version = "0.1.43", default-features = false }

# Error Handling & Telemetry
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "ansi"] }

# Data & Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Multi-threading & Concurrency
rayon = "1.10.0"
tokio = { version = "1.43.0", features = ["sync", "rt", "time"] }
crossbeam-channel = "0.5.14"

# Graph Engine & String Interning
petgraph = { version = "0.7.1", default-features = false, features = ["graphmap"] }
arc-swap = "1.7.1"
lasso = { version = "0.7.3", features = ["multi-threaded"] }

# SQLite Storage & Connection Pooling
rusqlite = { version = "0.33.0", features = ["bundled", "modern_sqlite", "vtab", "backup"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.26.0"

# Security, Regex, Entropy & Hashing
regex = "1.11.1"
sha2 = "0.10.8"
twox-hash = "2.1.0"
walkdir = "2.5.0"
ignore = "0.4.23"
tempfile = "3.17.1"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.23.2"
tree-sitter-go = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.23.4"
