[workspace]
resolver = "2"
members = [
    "crates/autodoc-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daniel Gonçalves Araujo"]
license = "MIT"
repository = "https://github.com/dandgabr/autodoc"

[workspace.dependencies]
# NAPI-RS Native Bindings
napi = { version = "2.16.16", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2.16.13"
napi-build = "2.2.4"

# Memory Allocator
mimalloc = { version = "0.1.43", default-features = false }

# Error Handling & Telemetry
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "ansi"] }

# Data & Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
